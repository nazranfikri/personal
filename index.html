<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>nspace.my</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <div class="container">
    <header>
      <div class="brand">
        <h1>nspace.my</h1>
        <div id="status" class="status">Connecting...</div>
      </div>
      <div class="top-actions">
        <button id="refreshBtn" class="secondary" type="button">Refresh</button>
      </div>
    </header>

    <div class="tabs">
      <button id="tabJournal" class="tab-btn active" type="button" data-tab="journal">Journal</button>
      <button id="tabExpenses" class="tab-btn secondary" type="button" data-tab="expenses">Expenses</button>
    </div>

    <!-- JOURNAL SECTION -->
    <section id="sectionJournal">
      <form id="journalForm" class="card">
        <div class="grid-2">
          <input id="jDate" type="date" required />
          <input id="jTime" type="text" placeholder="Time (e.g. Morning / 21:30)" value="All Day" />
          <select id="jType">
            <option value="Diary">Diary</option>
            <option value="Task">Task</option>
            <option value="Note">Note</option>
          </select>
          <input id="jCategory" type="text" placeholder="Category" value="Personal" />
        </div>
        <div class="grid-2 grid-1">
          <input id="jTitle" type="text" placeholder="Title" required />
        </div>
        <textarea id="jContent" placeholder="Write details..."></textarea>
        <button type="submit">Save Journal Entry</button>
      </form>

      <div id="journalList" class="list"></div>
    </section>

    <!-- EXPENSES SECTION -->
    <section id="sectionExpenses" class="hidden">
      <form id="expenseForm" class="card">
        <div class="grid-2">
          <input id="eDate" type="date" required />
          <input id="eAmount" type="number" step="0.01" min="0" placeholder="Amount (e.g. 15.50)" required />
          <input id="eCategory" type="text" placeholder="Category (e.g. Food, Fuel)" value="Food" />
          <input id="eNote" type="text" placeholder="Note" />
        </div>
        <button type="submit">Save Expense</button>
      </form>

      <div id="expenseList" class="list"></div>
    </section>
  </div>

  <script src="./app.js"></script>
</body>
</html>
